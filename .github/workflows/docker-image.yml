name: Laravel CI/CD

on:
  push:
    branches:
      - main

jobs:
  

  tests:
    name: Run Tests
    runs-on: ubuntu-latest

    env:
      APP_ENV: testing

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          extensions: pdo_pgsql, zip, bcmath, opcache
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('**/composer.lock') }}

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Prepare Laravel
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run Tests
        run: php artisan test

  setup-env:
    needs: tests
    runs-on: ymt-cr1-github-runner-prod-01
    outputs:
      env_setup: ${{ steps.env_config.outputs.env_setup }}
    steps:
      - name: Set environment variable
        id: env_config
        run: |
          if [[ $GITHUB_REF == 'refs/heads/main' ]]; then
            echo "env_setup=prod" >> "$GITHUB_OUTPUT"
          elif [[ $GITHUB_REF == 'refs/heads/development' ]]; then
            echo "env_setup=dev" >> "$GITHUB_OUTPUT"
          else
            echo "env_setup=unknown" >> "$GITHUB_OUTPUT"
          fi
  build-image:
    name: Build & Push Docker Image
    needs: setup-env
    runs-on: self-hosted
    outputs:
      NEW_VERSION: ${{ steps.version.outputs.version }}

    env:
      DOCKER_BUILDKIT: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Version
        id: version
        uses: paulhatch/semantic-version@v5.4.0
        with:
          tag_prefix: "v"
          major_pattern: "major:"
          minor_pattern: "feat:"

      - name: Set Variables
        run: |
          echo "NEW_VERSION=${{ steps.version.outputs.version }}" >> $GITHUB_ENV
          echo "DOCKER_CONTAINER=${{ secrets.DOCKER_CONTAINER }}" >> $GITHUB_ENV

      - name: Docker Login
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login \
          -u "${{ secrets.DOCKER_USER }}" \
          --password-stdin

      - name: Build Docker Image
        run: |
          docker build \
            -t "$DOCKER_CONTAINER:$NEW_VERSION" \
            -t "$DOCKER_CONTAINER:latest" .

      - name: Push Docker Image
        run: |
          docker push "$DOCKER_CONTAINER:$NEW_VERSION"
          docker push "$DOCKER_CONTAINER:latest"

      - name: Docker Logout
        run: docker logout
  deploy:
    needs: build-image
    runs-on: self-hosted
    environment:
      name: ${{ needs.setup-env.outputs.env_setup }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate ENV
        env:
          APP_NAME: ${{ vars.APP_NAME }}
          APP_ENV: ${{ vars.APP_ENV }}
          APP_DEBUG: ${{ vars.APP_DEBUG }}
          APP_URL: ${{ vars.APP_URL }}
          APP_KEY: ${{ secrets.APP_KEY }}
          DB_CONNECTION: ${{ vars.DB_CONNECTION }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_DATABASE: ${{ secrets.DB_DATABASE }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

        run: |
          cp .env.template .env

          python3 - <<'EOF'
          import os, re

          with open('.env', 'r') as f:
              content = f.read()

          replacements = {
              'APP_NAME':      os.environ.get('APP_NAME', ''),
              'APP_ENV':       os.environ.get('APP_ENV', ''),
              'APP_KEY':       os.environ.get('APP_KEY', ''),
              'APP_DEBUG':     os.environ.get('APP_DEBUG', ''),
              'APP_URL':       os.environ.get('APP_URL', ''),
              'DB_CONNECTION': os.environ.get('DB_CONNECTION', ''),
              'DB_HOST':       os.environ.get('DB_HOST', ''),
              'DB_PORT':       os.environ.get('DB_PORT', ''),
              'DB_DATABASE':   os.environ.get('DB_DATABASE', ''),
              'DB_USERNAME':   os.environ.get('DB_USERNAME', ''),
              'DB_PASSWORD':   os.environ.get('DB_PASSWORD', ''),
          }

          for key, value in replacements.items():
              content = re.sub(
                  rf'^({re.escape(key)})=.*$',
                  rf'\1={value}',
                  content,
                  flags=re.MULTILINE
              )

          with open('.env', 'w') as f:
              f.write(content)

          # Verificar resultado
          with open('.env', 'r') as f:
              for line in f:
                  for key in replacements:
                      if line.startswith(key + '='):
                          val = line.strip().split('=', 1)[1]
                          status = "✅" if val else "❌ VACÍO"
                          print(f"{status} {key}={'***' if 'KEY' in key or 'PASSWORD' in key or 'HOST' in key else val}")

          print("✅ .env generado correctamente")
          EOF

          echo "===== ENV GENERATED ====="

      - name: Docker Login
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login \
          -u "${{ secrets.DOCKER_USER }}" \
          --password-stdin

      - name: Copy deployment files
        run: |
          mkdir -p /apps/laravel-app 
          cp docker-compose.yml /apps/laravel-app/ 
          cp .env /apps/laravel-app/

      - name: Set Variables Deploy
        run: |
          echo "NEW_VERSION=${{ needs.build-image.outputs.NEW_VERSION }}" >> $GITHUB_ENV
          echo "DOCKER_CONTAINER=${{ secrets.DOCKER_CONTAINER }}" >> $GITHUB_ENV

      - name: Deploy containers
        run: |
          cd /apps/laravel-app
          docker pull "$DOCKER_CONTAINER:$NEW_VERSION"
          docker compose down && docker compose up -d

      - name: Laravel Optimize
        run: |
          cd /apps/laravel-app
          docker compose exec -T app php artisan optimize

      - name: Run Migrations
        run: |
          cd /apps/laravel-app
          docker compose exec -T app php artisan migrate --force

      - name: Clear Cache
        run: |
          cd /apps/laravel-app
          docker compose exec -T app php artisan cache:clear && \
          docker compose exec -T app php artisan config:clear && \
          docker compose exec -T app php artisan route:clear && \
          docker compose exec -T app php artisan view:clear

      - name: Docker Logout
        run: docker logout
