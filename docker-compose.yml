services:
  app:
    container_name: laravel_app
    image: $DOCKER_CONTAINER:$NEW_VERSION
    environment:
      APP_NAME: ${APP_NAME}
      APP_ENV: ${APP_ENV}
      APP_KEY: ${APP_KEY}
      APP_DEBUG: ${APP_DEBUG}
      APP_URL: ${APP_URL}
      DB_CONNECTION: ${DB_CONNECTION}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - laravel_public:/var/www/laravel/public
      - laravel_storage:/var/www/laravel/storage/app/public
      - ./.env:/var/www/laravel/.env
    expose:
      - "9000"
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - proxy-network

networks:
  proxy-network:
    name: proxy-network
    external: true

volumes:
  laravel_public:
    external: true
  laravel_storage:
    external: true